name: CD — Deploy to Production

on:
  push:
    branches: [main]
  # 手動トリガーも可能
  workflow_dispatch:

jobs:
  # ── バックエンド (FastAPI) は OCI 上で手動デプロイ運用 ─────────────
  # Render からOCIへ移行済み（deploy/deploy_to_oci.ps1 を都度手動実行する方式。
  # CLAUDE.md「OCIへの移行」節参照）。GitHub Actions からの自動デプロイは無い。

  # ── Vercel（フロントエンド ダッシュボード）デプロイ ────────────
  deploy-vercel:
    name: Deploy Dashboard to Vercel
    runs-on: ubuntu-latest
    # dashboard/ 配下に変更があった場合のみデプロイ
    # （バックエンドのみの変更でダッシュボードを再デプロイしない）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        # VERCEL_TOKEN を GitHub Secrets に登録することでデプロイが有効になる
        working-directory: dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            vercel deploy --prod --token=$VERCEL_TOKEN --yes
          else
            echo "VERCEL_TOKEN is not set. Skipping Vercel deploy."
          fi
