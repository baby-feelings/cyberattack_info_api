name: OSV-Scanner — PR Scan

# PRで新たに導入された脆弱性のみを検出する（ベースブランチとの差分スキャン）
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# 呼び出す再利用ワークフロー（osv-scanner-reusable-pr.yml）は最上位で security-events: write を
# 要求する。呼び出し側がこれを許可していないと、ワークフローが起動すらせず startup_failure になる
# （SARIF アップロードは無効化しているが、権限の宣言自体は必須）
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8"
    with:
      # requirements.txt / package.json を再帰的にスキャン
      scan-args: "--recursive ./"
      # Code Scanning（GitHub Advanced Security）未有効のため SARIF アップロードを無効化
      upload-sarif: false
