name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 変更されたファイルから、バックエンド・ダッシュボードのテストが必要かを判定する。
  # ドキュメント（*.md・docs/・.claude/）だけの変更では、どちらも動かさない。
  # ワークフロー単位の paths 絞り込みにしない理由: 将来ブランチ保護で「必須チェック」を設定した
  # とき、チェックが報告されずマージが止まる。ジョブ単位で省略すれば成功扱いになる。
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      dashboard: ${{ steps.detect.outputs.dashboard }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 比較元（PR の base・push の直前のコミット）を取得するため全履歴を使う
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # 比較元: PR は base、push は直前のコミット。判定できない場合は安全側（全部実行）
          base="$BEFORE_SHA"
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_SHA"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "比較元を特定できないため、すべて実行します"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$base" HEAD)
          echo "変更されたファイル:"; echo "$files"

          # バックエンド: アプリ・テスト・マイグレーション・依存・設定・Docker・ZAP 用ファイル
          backend_re='^(app|tests|alembic|deploy/zap)/|^(requirements[^/]*\.txt|pyproject\.toml|alembic\.ini|Dockerfile|semgrep-cli\.txt|zizmor-cli\.txt|\.python-version)$'
          # ダッシュボード: dashboard/ 配下
          dashboard_re='^dashboard/'
          # このワークフロー自体を変えたときは、確認のためどちらも実行する
          self_re='^\.github/workflows/ci\.yml$'

          backend=false; dashboard=false
          if echo "$files" | grep -Eq "$backend_re|$self_re"; then backend=true; fi
          if echo "$files" | grep -Eq "$dashboard_re|$self_re"; then dashboard=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          echo "→ backend=$backend dashboard=$dashboard"

  test:
    # 本番（Dockerfile）・.python-version と同じ 3.13 のみ（3.10・3.11 はサポート対象外）
    name: Test & Lint (Python 3.13)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ── 静的解析 ────────────────────────────────────────────
      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports

      # ── テスト実行 ──────────────────────────────────────────
      - name: Run tests with pytest
        env:
          # テスト用環境変数（SQLite インメモリ使用）
          DATABASE_URL: sqlite:///./test.db
          API_KEY: test-api-key-for-pytest
          ENVIRONMENT: development
          GITHUB_USERNAME: test-github-user
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=html:htmlcov --cov-fail-under=90

      # ── カバレッジレポート ──────────────────────────────────
      - name: Upload coverage HTML report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  dashboard-test:
    name: Dashboard Test & Build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      # ── 静的解析（ESLint。警告数が package.json の上限を超えたら失敗） ──
      - name: Lint with ESLint
        working-directory: dashboard
        run: npm run lint

      # ── テスト実行（Vitest。プロジェクト全体で90%未満なら失敗、vite.config.ts参照） ──
      - name: Run tests with Vitest
        working-directory: dashboard
        run: npm run test:coverage

      - name: Upload coverage HTML report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-coverage-html-report
          path: dashboard/coverage/
          retention-days: 30

      # ── 型チェック・ビルド ────────────────────────────────
      - name: Build (includes tsc type check)
        working-directory: dashboard
        run: npm run build

  dashboard-e2e:
    name: Dashboard E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Type check E2E code
        working-directory: dashboard
        run: npm run e2e:typecheck

      # ── E2Eテスト（バックエンドAPIはモック）。シナリオ網羅率が90%未満なら失敗 ──
      - name: Run E2E tests
        working-directory: dashboard
        run: npm run e2e

      # HTMLレポート（playwright-report/index.html と scenario-coverage.html）。失敗時も保存する
      - name: Upload Playwright HTML report as artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dashboard-e2e-html-report
          path: dashboard/playwright-report/
          retention-days: 30
