name: pip-audit — Scheduled Scan

# OSV-Scanner（osv-scanner-scheduled.yml）とは別の情報源（PyPI Advisory Database）
# でのクロスチェックとして追加（Issue #63）。個々のPRをブロックしないよう、
# osv-scanner-scheduled.ymlと同じトリガー（毎週月曜・mainマージ時）で実行する
on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# 最小権限（リポジトリの読み取りのみ。zizmor: excessive-permissions）
permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install "pip-audit>=2.10.1"

      # requirements.txt（本番依存のみ）を対象とする。開発・テスト依存
      # （requirements-dev.txt）はデプロイ対象に含まれないため対象外
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc
